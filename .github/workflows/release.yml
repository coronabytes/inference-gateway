# Tests the gateway and publishes its image.
#
# Push a tag like `v1.2.0` to publish: a linux/amd64 + linux/arm64 image is pushed to
# ghcr.io/<owner>/inference-gateway with the version, major.minor, major and (for
# non-prerelease tags) `latest` tags, with an SBOM, build provenance and a signed provenance
# attestation attached, and a GitHub release is created. Only admins can create, move or delete `v*`
# tags (a tag ruleset), and once released, not even they can (immutable releases, a repository setting). The tagged commit must be on main, and the checks its push to main
# ran must pass; they are not run again.
# Running it by hand from a branch in the Actions tab runs the checks first and pushes the
# image tagged with the commit.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag names a commit the push to main already checked: wait for that run instead of repeating it.
  checked-on-main:
    name: Checks passed on main
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The run may not exist yet when the tag is pushed right after the merge.
      - name: Wait for the Checks run of the tagged commit
        run: |
          sha=$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq .sha)
          for _ in $(seq 30); do
            id=$(gh run list --workflow checks.yml --branch main --event push --commit "$sha" --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$id" ] && break
            sleep 10
          done
          if [ -z "$id" ]; then
            echo "::error::No Checks run on main for $sha: tag a commit on main."
            exit 1
          fi
          gh run watch "$id" --interval 30 --exit-status

  # Run by hand: tests, sqlx metadata and dependency advisories, as on every push.
  checks:
    if: github.ref_type != 'tag'
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  # Each architecture builds on its own native runner (no QEMU) and is pushed
  # by digest only; the manifest job below joins them under the real tags.
  # Exactly one of the two jobs above runs; the other is skipped, so this and the jobs after it
  # state their condition instead of relying on the default, which skips them too.
  image:
    name: Gateway image (${{ matrix.platform }})
    needs: [checked-on-main, checks]
    if: ${{ !cancelled() && (needs.checked-on-main.result == 'success' || needs.checks.result == 'success') }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/inference-gateway

      # The version the gateway reports and the console shows: the tag, or the commit when run
      # by hand. The build context has no .git, so it is passed in as a build argument.
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="$GITHUB_REF_NAME"; else v="${GITHUB_SHA::7}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: GATEWAY_VERSION=${{ steps.version.outputs.value }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestations stored with the image: what it contains (SBOM) and how it was built.
          # The manifest job below keeps them when it joins the platforms.
          sbom: true
          provenance: mode=max
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/inference-gateway,push-by-digest=true,name-canonical=true,push=true
          # Per-platform scopes so the two builds don't evict each other's cache.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Multi-arch manifest
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Signing (a Sigstore certificate for the workflow's OIDC token) and storing the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/inference-gateway
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/inference-gateway@sha256:%s ' *)

      - id: inspect
        name: Inspect image
        run: |
          ref=ghcr.io/${{ github.repository_owner }}/inference-gateway:${{ steps.meta.outputs.version }}
          docker buildx imagetools inspect "$ref"
          echo "digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      # Signed build provenance for the multi-arch image, pushed next to it and kept by GitHub:
      # `gh attestation verify oci://ghcr.io/<owner>/inference-gateway:<tag> --owner <owner>`.
      # The buildx SBOM and provenance above are not signed. Storage records need an organization.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/inference-gateway
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  release:
    name: GitHub release
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.manifest.result == 'success' }}
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
